name: Deploy TESTE - Igreja Batista Shallom

# Push na develop -> build das imagens + deploy no ambiente de teste/homologação.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-shallom-teste
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: igreja-shallom-api
            file: deploy/Dockerfile
          - image: igreja-shallom-web
            file: deploy/web.Dockerfile
          - image: igreja-shallom-app-publico
            file: deploy/app-publico.Dockerfile
          - image: igreja-shallom-app-membros
            file: deploy/app-membros.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/filipepires1/${{ matrix.image }}:test-${{ github.sha }}
            ghcr.io/filipepires1/${{ matrix.image }}:test
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy no ambiente de teste
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar containers de teste
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: test-${{ github.sha }}
        with:
          host: 116.203.100.189
          username: filipe
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            cd /opt/nextep/shallom
            export IMAGE_TAG

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            for c in nextep-shallom-api nextep-shallom-web nextep-shallom-app-publico nextep-shallom-app-membros; do
              status="missing"
              for i in $(seq 1 40); do
                status=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
                if [ "$status" = "healthy" ]; then
                  break
                fi
                sleep 3
              done
              echo "$c: $status"
              if [ "$status" != "healthy" ]; then
                docker logs "$c" --tail 40 || true
                exit 1
              fi
            done

            docker compose ps
