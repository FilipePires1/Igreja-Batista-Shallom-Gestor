name: Deploy PRODUCAO - Igreja Batista Shallom

# Produção NÃO sobe em push. Roda manualmente (workflow_dispatch) ou por
# repository_dispatch do Gestor, sempre com aprovação no environment "producao".
on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-production]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-shallom-producao
  cancel-in-progress: false

env:
  HUB_URL: https://hub.nextepsolutions.com.br

jobs:
  verify:
    name: Verificar aprovacao no Gestor
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Resolver commit e validar solicitacao
        id: resolve
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          PAYLOAD_SHA: ${{ github.event.client_payload.commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Execucao manual: commit $GITHUB_SHA"
            echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$REQUEST_ID" ] || [ -z "$PAYLOAD_SHA" ]; then
            echo "Payload do Gestor incompleto"
            exit 1
          fi
          STATUS=$(curl -fsS "$HUB_URL/api/internal/deploy-requests/$REQUEST_ID/status" \
            -H "X-Deploy-Token: ${{ secrets.HUB_DEPLOY_TOKEN }}" | jq -r '.data.status')
          echo "Status da solicitacao: $STATUS"
          if [ "$STATUS" != "approved" ]; then
            echo "Deploy NAO aprovado. Abortando."
            exit 1
          fi
          echo "commit_sha=$PAYLOAD_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: igreja-shallom-api
            file: deploy/Dockerfile
          - image: igreja-shallom-web
            file: deploy/web.Dockerfile
          - image: igreja-shallom-app-publico
            file: deploy/app-publico.Dockerfile
          - image: igreja-shallom-app-membros
            file: deploy/app-membros.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/filipepires1/${{ matrix.image }}:${{ needs.verify.outputs.commit_sha }}
            ghcr.io/filipepires1/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy em produção
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Garantir que o deploy é da main
        run: |
          REF="${{ github.ref }}"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Deploy de produção só a partir da branch main (ref atual: $REF)."
            exit 1
          fi

      - name: Atualizar containers de produção
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.verify.outputs.commit_sha }}
        with:
          host: 116.203.100.189
          username: filipe
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            cd /opt/nextep/shallom-prod
            export IMAGE_TAG

            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --remove-orphans
            docker image prune -f

            for c in nextep-shallom-prod-api nextep-shallom-prod-web nextep-shallom-prod-app-publico nextep-shallom-prod-app-membros; do
              status="missing"
              for i in $(seq 1 40); do
                status=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
                if [ "$status" = "healthy" ]; then
                  break
                fi
                sleep 3
              done
              echo "$c: $status"
              if [ "$status" != "healthy" ]; then
                docker logs "$c" --tail 40 || true
                exit 1
              fi
            done

            docker compose -f compose.prod.yml ps

      - name: Marcar deploy como concluido no Gestor
        if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.request_id != '' }}
        run: |
          curl -fsS -X POST "$HUB_URL/api/internal/deploy-requests/${{ github.event.client_payload.request_id }}/deployed" \
            -H "X-Deploy-Token: ${{ secrets.HUB_DEPLOY_TOKEN }}"
