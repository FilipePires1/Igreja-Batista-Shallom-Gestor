
# Gere o hash com: docker exec nextep-edge caddy hash-password --plaintext 'SENHA'
shallom.116-203-100-189.sslip.io {
	encode zstd gzip
	basic_auth {
		shallomprod __BASIC_AUTH_HASH__
	}
	reverse_proxy nextep-shallom-prod-web:80
}

app.116-203-100-189.sslip.io {
	encode zstd gzip
	reverse_proxy nextep-shallom-prod-app-publico:80
}

membros.116-203-100-189.sslip.io {
	encode zstd gzip
	basic_auth {
		shallomprod __BASIC_AUTH_HASH__
	}
	handle /api/* {
		reverse_proxy nextep-shallom-prod-api:3000
	}
	handle {
		reverse_proxy nextep-shallom-prod-app-membros:80
	}
}
